# Render "Blueprint": one free web service that serves BOTH the API and the built React app.
# The database is a free external PostgreSQL (for example Neon): paste its connection string
# into DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: internly
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # you provide this secret in the dashboard
      - key: SEED_ON_EMPTY
        value: "true" # loads the demo data into an empty database
      - key: AI_API_KEY
        sync: false # optional: leave empty to use the offline explanation writer
