<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Applicants | Internly</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header id="site-header" class="site-header"></header>
    <main id="content" class="container container--medium">
      <h1>Applicants</h1>
      <form id="filters" class="form-grid">
        <div class="field">
          <label for="listingId">Internship</label>
          <select id="listingId" name="listingId">
            <option value="">All my internships</option>
          </select>
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="">Any status</option>
            <option value="pending">Pending</option>
            <option value="accepted">Accepted</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
      </form>
      <div id="action-error"></div>
      <div id="list"></div>
    </main>
    <footer id="site-footer" class="site-footer"></footer>
    <script type="module" src="/js/pages/applicants.js"></script>
  </body>
</html>
