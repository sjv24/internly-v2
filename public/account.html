<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account | Internly</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header id="site-header" class="site-header"></header>

    <main id="content" class="container container--medium stack">
      <h1>Account</h1>

      <form id="profile-form" class="card card--padded" novalidate>
        <h2>Profile</h2>
        <p id="signed-in-as" class="muted"></p>
        <div id="profile-msg"></div>
        <div class="field">
          <label for="name" id="name-label">Name</label>
          <input id="name" name="name" type="text" required />
        </div>
        <div class="field">
          <label for="currentPassword">Current password</label>
          <input
            id="currentPassword"
            name="currentPassword"
            type="password"
            autocomplete="current-password"
          />
          <p class="hint">Only needed to change your password</p>
        </div>
        <div class="field">
          <label for="newPassword">New password</label>
          <input
            id="newPassword"
            name="newPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
          />
          <p class="hint">At least 8 characters</p>
        </div>
        <button type="submit" class="btn btn--primary">Save changes</button>
      </form>

      <form id="delete-form" class="card card--padded card--danger" novalidate>
        <h2 style="color: var(--danger)">Delete account</h2>
        <p>This permanently removes your account and all your data.</p>
        <div id="delete-msg"></div>
        <div class="field">
          <label for="password">Confirm with your password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn--danger">Delete my account</button>
      </form>
    </main>

    <footer id="site-footer" class="site-footer"></footer>
    <script type="module" src="/js/pages/account.js"></script>
  </body>
</html>
