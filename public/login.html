<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in | Internly</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header id="site-header" class="site-header"></header>

    <main id="content" class="container container--narrow">
      <div class="card card--padded">
        <h1>Welcome back</h1>
        <p class="muted">Log in as a student or a company.</p>

        <form id="login-form" novalidate>
          <div id="form-error"></div>
          <div class="field">
            <label for="email">Email <span class="required" aria-hidden="true">*</span></label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password <span class="required" aria-hidden="true">*</span></label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn btn--primary btn--block">Log in</button>
        </form>

        <p class="muted" style="margin-top: 1.25rem; text-align: center">
          New here? <a href="/signup">Create an account</a>
        </p>
        <p id="demo-hint" class="hidden alert alert--success" style="margin-top: 1rem">
          Demo logins (local only, password <code>Password123!</code>): <code>student@internly.dev</code> or
          <code>company@internly.dev</code>
        </p>
      </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>
    <script type="module" src="/js/pages/login.js"></script>
  </body>
</html>
